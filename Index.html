<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL Fixer</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 16px; padding: 20px; box-sizing: border-box;
    font-family: system-ui, sans-serif; background: #f4f4f4;
  }
  textarea, button { width: 100%; max-width: 600px; font-size: 18px; border-radius: 10px; box-sizing: border-box; }
  textarea { height: 40vh; padding: 12px; border: 1px solid #ccc; resize: none; }
  button { padding: 18px; border: none; background: #1a73e8; color: #fff; font-weight: bold; }
  button:active { background: #155ab6; }
  .row { display: flex; gap: 12px; width: 100%; max-width: 600px; }
  .row button { flex: 1; }
  #paste { background: #5f6368; }
  #paste:active { background: #3c4043; }
</style>
</head>
<body>
  <textarea id="url" placeholder="Paste URL here" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
  <div class="row">
    <button id="paste">Paste</button>
    <button id="go">Open</button>
  </div>
<script>
  document.getElementById('paste').addEventListener('click', async () => {
    try {
      document.getElementById('url').value = await navigator.clipboard.readText();
    } catch (e) {
      alert('Clipboard access blocked. Long-press the box and paste instead.');
    }
  });

  document.getElementById('go').addEventListener('click', () => {
    let url = document.getElementById('url').value.trim();
    if (!url) return;
    url = url.replaceAll('youtube', 'yout-ube');
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    window.location.href = url;
  });
</script>
</body>
</html>
